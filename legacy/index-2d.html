<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>波斯菊花海 · 动态壁纸</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #3d6a28; font-family: system-ui, "Microsoft YaHei", "PingFang SC", sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; }

  #gear {
    position: fixed; right: 18px; bottom: 18px; width: 44px; height: 44px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.45); background: rgba(30,45,30,.35); color: #fff; font-size: 22px;
    backdrop-filter: blur(8px); cursor: pointer; opacity: 0; transition: opacity .4s; z-index: 10;
  }
  #gear.show, #gear:hover { opacity: 1; }
  #panel {
    position: fixed; top: 12px; right: 12px; bottom: 12px; width: 330px; overflow-y: auto; z-index: 11;
    background: rgba(250,250,247,.82); backdrop-filter: blur(14px); border-radius: 14px;
    box-shadow: 0 10px 40px rgba(0,0,0,.25); color: #2b3328; font-size: 13px;
    transform: translateX(360px); transition: transform .3s ease; padding: 0 16px 16px;
  }
  #panel.open { transform: none; }
  #panel header {
    position: sticky; top: 0; display: flex; align-items: center; justify-content: space-between;
    padding: 14px 0 10px; background: linear-gradient(rgba(250,250,247,.97) 75%, rgba(250,250,247,0));
  }
  #panel h1 { font-size: 16px; margin: 0; }
  #panel h2 { font-size: 12px; letter-spacing: .1em; color: #6b7a62; margin: 16px 0 6px; font-weight: 600; }
  .row { display: grid; grid-template-columns: 78px 1fr 46px; align-items: center; gap: 8px; margin: 7px 0; }
  .row label { color: #3d4a37; }
  .row .val { text-align: right; font-variant-numeric: tabular-nums; color: #6b7a62; }
  .row.check { grid-template-columns: 1fr auto; }
  .row.color { grid-template-columns: 54px 34px 1fr 38px; }
  input[type=range] { width: 100%; accent-color: #c2185b; }
  input[type=color] { width: 30px; height: 24px; border: none; padding: 0; background: none; cursor: pointer; }
  input[type=checkbox] { width: 16px; height: 16px; accent-color: #c2185b; }
  select, input[type=number] {
    width: 100%; box-sizing: border-box; padding: 4px 6px; border: 1px solid #cfd6c8; border-radius: 6px; background: #fff; font: inherit;
  }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  button.b {
    padding: 7px 8px; border: 1px solid #cfd6c8; border-radius: 8px; background: #fff; cursor: pointer; font: inherit; color: #2b3328;
  }
  button.b:hover { background: #f3f6ef; }
  button.b.primary { background: #c2185b; border-color: #c2185b; color: #fff; }
  button.icon { border: none; background: none; font-size: 18px; cursor: pointer; color: #556; padding: 2px 6px; }
  .presets { display: flex; flex-wrap: wrap; gap: 6px; }
  .presets button { padding: 4px 10px; border-radius: 999px; border: 1px solid #e0b5c8; background: #fff6fa; cursor: pointer; font: inherit; font-size: 12px; color: #9c1650; }
  .presets button:hover { background: #fde4ef; }
  .hint { color: #7d8a75; font-size: 11.5px; line-height: 1.5; margin: 6px 0; }
  code.cmd { display: block; padding: 7px 8px; background: #263023; color: #d9f0c8; border-radius: 6px; font-size: 11.5px; word-break: break-all; margin-top: 6px; }
  #toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); padding: 8px 16px; border-radius: 999px;
    background: rgba(20,30,20,.7); color: #fff; font-size: 13px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 12;
  }
  #toast.show { opacity: 1; }
  #fps { position: fixed; left: 10px; top: 8px; color: #fff; font: 12px monospace; text-shadow: 0 1px 2px #000; display: none; z-index: 9; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="fps"></div>
<button id="gear" title="设置 (S)">⚙</button>
<aside id="panel">
  <header><h1>🌸 花海设置</h1><button class="icon" id="close" title="关闭 (S / Esc)">✕</button></header>
  <h2>预设</h2>
  <div class="presets" id="presets"></div>
  <div id="controls"></div>
  <h2>导出视频</h2>
  <div class="row"><label>分辨率</label>
    <select id="exportRes" style="grid-column: span 2">
      <option value="1920x1080">1920 × 1080</option>
      <option value="2560x1440">2560 × 1440</option>
      <option value="3840x2160">3840 × 2160 (4K)</option>
      <option value="screen">与当前屏幕一致</option>
    </select></div>
  <div class="row"><label>帧率</label>
    <select id="exportFps" style="grid-column: span 2">
      <option value="30">30 fps</option><option value="60">60 fps</option><option value="24">24 fps</option>
    </select></div>
  <div class="hint">导出配置后，在项目目录运行下面的命令即可得到首尾无缝循环的 MP4：</div>
  <code class="cmd">node render.js --config flower-sea.config.json</code>
  <div class="btns">
    <button class="b primary" id="export">导出配置</button>
    <button class="b" id="import">导入配置</button>
    <button class="b" id="reset">恢复默认</button>
    <button class="b" id="hide">隐藏面板</button>
  </div>
  <div class="hint">快捷键：S 打开/关闭面板。网址加 <b>?ui=0</b> 可彻底隐藏设置按钮（适合作为桌面壁纸）。设置会自动保存在本机浏览器中。</div>
  <input type="file" id="file" accept=".json,application/json" hidden>
</aside>
<div id="toast"></div>
<script src="scene.js"></script>
<script>
  const { createScene, DEFAULTS } = FlowerScene;
  const STORE = 'flower-sea-config-v1';
  const VIEW_DEFAULTS = { scale: 'auto', fpsCap: 60, showFps: false };
  const clone = (o) => JSON.parse(JSON.stringify(o));

  const FLOWER_NAMES = { white: '白色', pink: '浅粉', magenta: '玫红', crimson: '酒红' };
  const SCHEMA = [
    { group: '动画', items: [
      { key: 'period', label: '循环时长', min: 5, max: 60, step: 1, unit: 's', fmt: (v) => v + 's' },
      { key: 'wind', label: '风力', min: 0, max: 3, step: 0.05 },
      { key: 'windSpeed', label: '风速', min: 0.25, max: 3, step: 0.05 },
    ] },
    { group: '花海', items: [
      { key: 'flowerDensity', label: '花朵密度', min: 0, max: 5, step: 0.1 },
      { key: 'flowerSize', label: '花朵大小', min: 0.4, max: 2.5, step: 0.05 },
      { key: 'grassDensity', label: '草丛密度', min: 0.4, max: 1.8, step: 0.05 },
      { key: 'heroes', label: '前景大花', type: 'check' },
      { key: 'heroSize', label: '大花尺寸', min: 0.5, max: 1.8, step: 0.05 },
      { key: 'seed', label: '布局种子', type: 'seed' },
    ] },
    { group: '花色（颜色 + 占比）', items: Object.keys(FLOWER_NAMES).map((k) => ({ key: k, label: FLOWER_NAMES[k], type: 'color' })) },
    { group: '场景', items: [
      { key: 'skyline', label: '城市背景', type: 'check' },
      { key: 'horizon', label: '地平线', min: 0.2, max: 0.6, step: 0.005, fmt: (v) => Math.round(v * 100) + '%' },
      { key: 'haze', label: '远景雾气', min: 0, max: 2, step: 0.05 },
      { key: 'clouds', label: '天空薄云', type: 'check' },
      { key: 'cloudShadows', label: '花田云影', type: 'check' },
      { key: 'foreground', label: '前景虚化草', type: 'check' },
    ] },
    { group: '点缀', items: [
      { key: 'butterflies', label: '蝴蝶', min: 0, max: 10, step: 1, fmt: (v) => v + ' 只' },
      { key: 'petals', label: '飘落花瓣', min: 0, max: 30, step: 1, fmt: (v) => v + ' 片' },
      { key: 'pollen', label: '光点绒絮', min: 0, max: 3, step: 0.1 },
    ] },
    { group: '画质', view: true, items: [
      { key: 'scale', label: '渲染分辨率', type: 'select', options: [['auto', '自动（跟随屏幕）'], ['0.5', '0.5× 省电'], ['0.75', '0.75×'], ['1', '1×'], ['1.5', '1.5×'], ['2', '2× 高清']] },
      { key: 'fpsCap', label: '帧率上限', type: 'select', options: [['24', '24 fps'], ['30', '30 fps'], ['60', '60 fps'], ['0', '不限']] },
      { key: 'showFps', label: '显示帧率', type: 'check' },
    ] },
  ];

  const PRESETS = {
    '默认': {},
    '纯花海': { skyline: false, flowerDensity: 3.2, horizon: 0.33, haze: 0.8 },
    '繁花似锦': { flowerDensity: 5, flowerSize: 1.3, grassDensity: 1.2, heroes: false, skyline: false, horizon: 0.42 },
    '粉白梦境': { colorWeights: { white: 0.5, pink: 0.5, magenta: 0.06, crimson: 0 }, flowerDensity: 2.5, petals: 10, haze: 1.3 },
    '浓烈玫红': { colorWeights: { white: 0.1, pink: 0.15, magenta: 0.5, crimson: 0.3 }, flowerDensity: 2.2 },
    '微风静好': { wind: 0.45, windSpeed: 0.6, petals: 2, butterflies: 1, pollen: 0.6 },
    '大风起兮': { wind: 2.2, windSpeed: 1.8, petals: 18, pollen: 2 },
    '省电模式': { grassDensity: 0.6, flowerDensity: 0.8, pollen: 0.3, petals: 2, __view: { scale: '0.5', fpsCap: 30 } },
  };

  // ---------- 状态 ----------
  let cfg = clone(DEFAULTS), view = { ...VIEW_DEFAULTS };
  try {
    const saved = JSON.parse(localStorage.getItem(STORE) || 'null');
    if (saved) { cfg = mergeCfg(saved.cfg || {}); view = { ...VIEW_DEFAULTS, ...(saved.view || {}) }; }
  } catch (e) { /* 忽略损坏的存档 */ }

  function mergeCfg(o) {
    const c = { ...clone(DEFAULTS), ...o };
    c.colors = { ...DEFAULTS.colors, ...(o.colors || {}) };
    c.colorWeights = { ...DEFAULTS.colorWeights, ...(o.colorWeights || {}) };
    for (const k of Object.keys(c)) if (!(k in DEFAULTS)) delete c[k];
    return c;
  }
  const save = () => localStorage.setItem(STORE, JSON.stringify({ cfg, view }));

  // ---------- 渲染 ----------
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const makeCanvas = (w, h) => {
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h));
    return c;
  };
  let scene = null;
  function build() {
    const k = view.scale === 'auto' ? Math.min(window.devicePixelRatio || 1, 2) : +view.scale;
    canvas.width = Math.max(320, Math.round(innerWidth * k));
    canvas.height = Math.max(180, Math.round(innerHeight * k));
    scene = createScene({ ...cfg, width: canvas.width, height: canvas.height, makeCanvas });
  }
  let buildTimer;
  function scheduleBuild(delay = 180) { clearTimeout(buildTimer); buildTimer = setTimeout(build, delay); }
  addEventListener('resize', () => scheduleBuild(250));
  build();

  const start = performance.now();
  const fpsEl = document.getElementById('fps');
  let last = 0, fpsCount = 0, fpsT = start;
  (function frame(now) {
    requestAnimationFrame(frame);
    const cap = +view.fpsCap;
    if (cap > 0 && now - last < 1000 / cap - 2) return;
    last = now;
    scene.draw(ctx, (now - start) / 1000);
    fpsCount++;
    if (now - fpsT > 500) { fpsEl.textContent = `${Math.round(fpsCount * 1000 / (now - fpsT))} fps · ${canvas.width}×${canvas.height}`; fpsCount = 0; fpsT = now; }
  })(start);

  // ---------- 面板 ----------
  const panel = document.getElementById('panel'), gear = document.getElementById('gear');
  const controls = document.getElementById('controls');
  const showUI = new URLSearchParams(location.search).get('ui') !== '0';
  if (!showUI) gear.style.display = 'none';
  const togglePanel = (open = !panel.classList.contains('open')) => panel.classList.toggle('open', open && showUI);
  gear.onclick = () => togglePanel(true);
  document.getElementById('close').onclick = document.getElementById('hide').onclick = () => togglePanel(false);
  addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' && e.target.type === 'number') return;
    if (e.key === 's' || e.key === 'S') togglePanel();
    if (e.key === 'Escape') togglePanel(false);
  });
  let gearTimer;
  addEventListener('mousemove', () => {
    gear.classList.add('show'); clearTimeout(gearTimer);
    gearTimer = setTimeout(() => gear.classList.remove('show'), 2500);
  });

  const toastEl = document.getElementById('toast');
  let toastTimer;
  function toast(msg) { toastEl.textContent = msg; toastEl.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800); }

  const refreshers = [];
  function onChange(isView, needsBuild = true) {
    save();
    fpsEl.style.display = view.showFps ? 'block' : 'none';
    if (needsBuild) scheduleBuild();
  }

  function el(tag, attrs = {}, ...kids) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) { if (k in e) e[k] = v; else e.setAttribute(k, v); }
    e.append(...kids);
    return e;
  }

  for (const sec of SCHEMA) {
    controls.append(el('h2', {}, sec.group));
    const target = () => (sec.view ? view : cfg);
    for (const it of sec.items) {
      const type = it.type || 'range';
      if (type === 'range') {
        const val = el('span', { className: 'val' });
        const inp = el('input', { type: 'range', min: it.min, max: it.max, step: it.step });
        const show = () => { val.textContent = it.fmt ? it.fmt(+inp.value) : (+inp.value).toFixed(2).replace(/\.?0+$/, ''); };
        inp.oninput = () => { target()[it.key] = +inp.value; show(); onChange(sec.view); };
        refreshers.push(() => { inp.value = target()[it.key]; show(); });
        controls.append(el('div', { className: 'row' }, el('label', {}, it.label), inp, val));
      } else if (type === 'check') {
        const inp = el('input', { type: 'checkbox' });
        inp.onchange = () => { target()[it.key] = inp.checked; onChange(sec.view, !sec.view); };
        refreshers.push(() => { inp.checked = !!target()[it.key]; });
        controls.append(el('label', { className: 'row check' }, el('span', {}, it.label), inp));
      } else if (type === 'select') {
        const sel = el('select', { style: 'grid-column: span 2' }, ...it.options.map(([v, t]) => el('option', { value: v }, t)));
        sel.onchange = () => { view[it.key] = sel.value; onChange(true, it.key === 'scale'); };
        refreshers.push(() => { sel.value = String(target()[it.key]); });
        controls.append(el('div', { className: 'row' }, el('label', {}, it.label), sel));
      } else if (type === 'seed') {
        const inp = el('input', { type: 'number', min: 0, step: 1 });
        const dice = el('button', { className: 'b', title: '随机换一种布局' }, '🎲');
        dice.style.padding = '3px 0';
        inp.onchange = () => { cfg.seed = Math.max(0, Math.floor(+inp.value || 0)); onChange(false); };
        dice.onclick = () => { cfg.seed = Math.floor(Math.random() * 1e6); inp.value = cfg.seed; onChange(false); };
        refreshers.push(() => { inp.value = cfg.seed; });
        controls.append(el('div', { className: 'row' }, el('label', {}, it.label), inp, dice));
      } else if (type === 'color') {
        const col = el('input', { type: 'color' });
        const w = el('input', { type: 'range', min: 0, max: 1, step: 0.01 });
        const pct = el('span', { className: 'val' });
        const showPct = () => {
          const sum = Object.values(cfg.colorWeights).reduce((a, b) => a + b, 0) || 1;
          pct.textContent = Math.round(cfg.colorWeights[it.key] / sum * 100) + '%';
        };
        col.oninput = () => { cfg.colors[it.key] = col.value; onChange(false); };
        w.oninput = () => { cfg.colorWeights[it.key] = +w.value; refreshers.forEach((f) => f.pct && f()); onChange(false); };
        const r = () => { col.value = cfg.colors[it.key]; w.value = cfg.colorWeights[it.key]; showPct(); };
        const rp = () => showPct(); rp.pct = true;
        refreshers.push(r, rp);
        controls.append(el('div', { className: 'row color' }, el('label', {}, it.label), col, w, pct));
      }
    }
  }
  const refreshAll = () => { refreshers.forEach((f) => f()); fpsEl.style.display = view.showFps ? 'block' : 'none'; };
  refreshAll();

  const presetsEl = document.getElementById('presets');
  for (const [name, p] of Object.entries(PRESETS)) {
    const b = el('button', {}, name);
    b.onclick = () => {
      const { __view, ...rest } = p;
      cfg = mergeCfg({ ...rest, seed: cfg.seed });
      if (__view) view = { ...view, ...__view };
      refreshAll(); onChange(false); toast('已应用预设：' + name);
    };
    presetsEl.append(b);
  }

  document.getElementById('reset').onclick = () => {
    cfg = clone(DEFAULTS); view = { ...VIEW_DEFAULTS }; refreshAll(); onChange(false); toast('已恢复默认设置');
  };

  document.getElementById('export').onclick = () => {
    const res = document.getElementById('exportRes').value;
    const [width, height] = res === 'screen'
      ? [Math.round(screen.width * (devicePixelRatio || 1)), Math.round(screen.height * (devicePixelRatio || 1))]
      : res.split('x').map(Number);
    const data = { ...cfg, width, height, fps: +document.getElementById('exportFps').value };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = el('a', { href: URL.createObjectURL(blob), download: 'flower-sea.config.json' });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast('已导出 flower-sea.config.json');
  };

  const fileInp = document.getElementById('file');
  document.getElementById('import').onclick = () => fileInp.click();
  fileInp.onchange = async () => {
    const f = fileInp.files[0]; if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      cfg = mergeCfg(data);
      if (data.width && data.height) {
        const opt = `${data.width}x${data.height}`;
        const sel = document.getElementById('exportRes');
        if ([...sel.options].some((o) => o.value === opt)) sel.value = opt;
      }
      if (data.fps) document.getElementById('exportFps').value = String(data.fps);
      refreshAll(); onChange(false); toast('配置已导入');
    } catch (e) { toast('配置文件无法解析'); }
    fileInp.value = '';
  };
</script>
</body>
</html>
