name: Smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build bundle
        run: npm run build

      - name: Verify committed dist is up to date
        run: git diff --exit-code -- dist/flower-sea.js

      - name: Setup Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2

      - name: Headless smoke test
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          cat > /tmp/smoke.cjs <<'SMOKE_EOF'
          const path = require('path');
          const { pathToFileURL } = require('url');
          const puppeteer = require('puppeteer-core');

          (async () => {
            const browser = await puppeteer.launch({
              executablePath: process.env.CHROME_PATH,
              headless: true,
              args: [
                '--no-sandbox',
                '--disable-gpu-sandbox',
                '--use-angle=swiftshader',
                '--enable-unsafe-swiftshader',
                '--ignore-gpu-blocklist',
                '--allow-file-access-from-files',
                '--hide-scrollbars',
                '--mute-audio',
                '--disable-background-timer-throttling',
              ],
            });
            const problems = [];
            try {
              const page = await browser.newPage();
              page.on('console', (m) => {
                if (m.type() === 'error' || m.type() === 'warning') problems.push(m.type() + ': ' + m.text());
              });
              page.on('pageerror', (e) => problems.push('pageerror: ' + e.message));
              await page.setViewport({ width: 1280, height: 720, deviceScaleFactor: 1 });
              const url = pathToFileURL(path.join(process.cwd(), 'index.html')).href + '?ui=0';
              await page.goto(url, { waitUntil: 'load', timeout: 60000 });
              await page.waitForFunction(() => {
                const c = document.querySelector('canvas');
                if (!c) return false;
                try { return !!(c.getContext('webgl2') || c.getContext('webgl')); } catch (e) { return false; }
              }, { timeout: 60000 });
              await new Promise((resolve) => setTimeout(resolve, 5000));
              const info = await page.evaluate(() => {
                const c = document.querySelector('canvas');
                const gl2 = c.getContext('webgl2');
                const gl = gl2 || c.getContext('webgl');
                return {
                  webgl2: !!gl2,
                  width: gl ? gl.drawingBufferWidth : 0,
                  height: gl ? gl.drawingBufferHeight : 0,
                  title: document.title,
                };
              });
              if (!info.webgl2) throw new Error('WebGL2 context is unavailable');
              if (!info.width || !info.height) throw new Error('Canvas drawing buffer is empty');
              if (problems.length) throw new Error('Console errors/warnings: ' + JSON.stringify(problems));
              console.log('SMOKE OK ' + JSON.stringify(info));
            } finally {
              await browser.close();
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          SMOKE_EOF
          node /tmp/smoke.cjs
